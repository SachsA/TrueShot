name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------
  # clang-format — fails if any tracked C++ file is not formatted.
  # Run locally with: clang-format -i $(git ls-files '*.cpp' '*.h')
  # -----------------------------------------------------------------
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # We use the pip-distributed clang-format wheel because:
      #  * it pins to an exact patch version (so CI and local dev never drift),
      #  * the apt clang-format package varies subtly across Ubuntu point
      #    releases on whitespace heuristics that have bitten us before.
      - name: Install clang-format (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "clang-format==18.1.8"
          clang-format --version

      - name: Run clang-format --dry-run --Werror
        run: |
          set -e
          # All tracked C++ headers/sources, excluding 3rd party and build dirs.
          mapfile -t FILES < <(git ls-files '*.cpp' '*.h' '*.hpp' \
            | grep -Ev '^(build/|netcode/build/|third_party/)' || true)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No C++ files to check."
            exit 0
          fi
          echo "Checking ${#FILES[@]} files..."
          clang-format --dry-run --Werror --style=file "${FILES[@]}"

  # -----------------------------------------------------------------
  # EditorConfig — verify tabs/spaces/EOLs match .editorconfig.
  # -----------------------------------------------------------------
  editorconfig:
    name: editorconfig-checker
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      # Download the Go binary directly from the release CDN with retry
      # — more reliable than the GitHub Action which fails on 504s.
      - name: Install editorconfig-checker
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 30
          shell: bash
          command: |
            set -euo pipefail
            VERSION=v3.0.3
            URL="https://github.com/editorconfig-checker/editorconfig-checker/releases/download/${VERSION}/ec-linux-amd64.tar.gz"
            mkdir -p "$HOME/.local/bin"
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
              "$URL" -o /tmp/ec.tar.gz
            tar -xzf /tmp/ec.tar.gz -C /tmp
            install -m 0755 /tmp/bin/ec-linux-amd64 "$HOME/.local/bin/ec"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show editorconfig-checker version
        run: ec --version

      - name: Run editorconfig-checker
        # `.ecrc` at repo root provides the excludes + disables IndentSize
        # (which fights with clang-format continuation-line alignment).
        run: ec

  # -----------------------------------------------------------------
  # markdownlint — quick sanity on README / ROADMAP / CONTRIBUTING.
  # Configured in .markdownlint.json (lenient — we don't want it
  # to flag every emoji or long URL).
  # -----------------------------------------------------------------
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            !netcode/build/**
            !build/**

  # -----------------------------------------------------------------
  # YAML lint — catch typos in workflow files themselves.
  # -----------------------------------------------------------------
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint -c .yamllint.yml .github/workflows
