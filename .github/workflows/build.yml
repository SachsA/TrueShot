name: build

# When to run: every push to main and every PR.
# Manual trigger also available via the Actions tab.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

# Cancel previous runs of the same branch when a new commit lands.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Shared env. The `x-gha` binary cache backend was removed by vcpkg
# in late 2025, so we cache the whole vcpkg installation directory via
# actions/cache instead — see the "Cache vcpkg" step below. Re-enable
# binary caching here only if vcpkg adds a replacement upstream.
env:
  # Keep a saner network policy: 5 attempts instead of vcpkg's default 3.
  X_VCPKG_NUGET_ID_PREFIX: ""

jobs:
  # ===================================================================
  # build — compile + smoke test on every supported OS.
  # ===================================================================
  build:
    name: build (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Run every matrix entry to see all failures.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ---------------------------------------------------------------
      # Cache the vcpkg-installed dependencies. We key on:
      #   - vcpkg.json content (deps + baseline)
      #   - the triplet (per-OS)
      # That way a vcpkg.json bump triggers a fresh install, but everything
      # else (incl. workflow changes) reuses the cache.
      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/buildtrees
            ${{ github.workspace }}/vcpkg/packages
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # ---------------------------------------------------------------
      # System packages required by GLFW / OpenGL on Linux.
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev libwayland-dev \
            libxkbcommon-dev libasound2-dev xvfb

      # ---------------------------------------------------------------
      # Ninja — robust install on the 3 OS.
      - name: Install Ninja
        # v6 is broken upstream (invalid zip download). Pinning v5 which
        # is stable. Still runs on Node 20 — warning is informational.
        uses: seanmiddleditch/gha-setup-ninja@v5

      # ---------------------------------------------------------------
      # MSVC env so cl.exe / link.exe are visible to Ninja.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------------------------------------------------------------
      # Bootstrap our OWN vcpkg into the workspace.
      # The runner-provided vcpkg is a shallow clone and doesn't have
      # the history needed to resolve the baseline pinned in vcpkg.json.
      # Cloning fresh here = reproducible builds, full git history,
      # no dependency on whatever the runner happens to ship.
      - name: Bootstrap vcpkg (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VCPKG_DIR="$GITHUB_WORKSPACE/vcpkg"
          # The actions/cache step restores vcpkg/buildtrees, packages,
          # downloads and installed/ — but NOT the vcpkg/.git folder
          # (we only cache build artefacts, not the git history). So
          # three states are possible:
          #   1. vcpkg/ doesn't exist at all       → clone fresh
          #   2. vcpkg/ exists, has .git           → refresh
          #   3. vcpkg/ exists, no .git           → clone INTO existing
          #      dir (needs init + remote add + checkout)
          if [ ! -d "$VCPKG_DIR" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          elif [ -d "$VCPKG_DIR/.git" ]; then
            git -C "$VCPKG_DIR" fetch --quiet origin
          else
            (
              cd "$VCPKG_DIR"
              git init -q
              git remote add origin https://github.com/microsoft/vcpkg.git
              git fetch --quiet --depth=1 origin master
              git reset --quiet --hard FETCH_HEAD
            )
          fi
          if [ ! -x "$VCPKG_DIR/vcpkg" ]; then
            "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$VCPKG_DIR" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VcpkgDir = "$env:GITHUB_WORKSPACE\vcpkg"
          if (-not (Test-Path $VcpkgDir)) {
            git clone https://github.com/microsoft/vcpkg.git $VcpkgDir
          } elseif (Test-Path "$VcpkgDir\.git") {
            git -C $VcpkgDir fetch --quiet origin
          } else {
            Push-Location $VcpkgDir
            git init -q
            git remote add origin https://github.com/microsoft/vcpkg.git
            git fetch --quiet --depth=1 origin master
            git reset --quiet --hard FETCH_HEAD
            Pop-Location
          }
          if (-not (Test-Path "$VcpkgDir\vcpkg.exe")) {
            & "$VcpkgDir\bootstrap-vcpkg.bat" -disableMetrics
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$VcpkgDir"

      # ---------------------------------------------------------------
      - name: Show toolchain versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          "$VCPKG_ROOT/vcpkg" version || true
          c++ --version || cl 2>&1 | head -1 || true

      # ---------------------------------------------------------------
      # Configure with retry — vcpkg downloads sources from github.com,
      # and intermittent 5xx/504 errors during dep install would otherwise
      # fail the whole job. Up to 5 attempts with growing back-off.
      - name: Configure
        uses: nick-fields/retry@v3
        env:
          # Force vcpkg's own retry logic to kick in harder before we
          # bail out of the attempt.
          X_VCPKG_FORCE_DOWNLOAD_RETRY: "1"
        with:
          timeout_minutes: 45
          max_attempts: 5
          retry_wait_seconds: 60
          shell: bash
          command: |
            cmake -S . -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DTRUESHOT_WARNINGS_AS_ERRORS=ON \
              -DTRUESHOT_BUILD_TESTS=ON

      # ---------------------------------------------------------------
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # ---------------------------------------------------------------
      # Unit tests (Phase 1.10): GoogleTest cases under tests/ — net
      # simulation determinism, bitstream round-trips, lag-comp math,
      # client prediction reconciliation. Cross-OS by construction.
      - name: Run unit tests
        working-directory: build
        run: ctest --output-on-failure --build-config ${{ matrix.build_type }}

      # ---------------------------------------------------------------
      # Smoke test: confirm the executable exists and is a valid binary.
      - name: Smoke test (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -x build/bin/TrueShot
          file build/bin/TrueShot

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "build/bin/${{ matrix.build_type }}/TrueShot.exe",
            "build/bin/TrueShot.exe"
          )
          $found = $false
          foreach ($exe in $candidates) {
            if (Test-Path $exe) {
              Write-Host "Found: $exe"
              Get-Item $exe
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Error "TrueShot.exe not found in any expected location"
            exit 1
          }

      # ---------------------------------------------------------------
      # Package the Release artefact (binary + shaders + LICENSE)
      # so playtesters can grab it from the run page.
      - name: Package artifact
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          mkdir -p dist/TrueShot-${{ runner.os }}
          cp -R build/bin/* dist/TrueShot-${{ runner.os }}/
          cp -R shaders     dist/TrueShot-${{ runner.os }}/
          cp README.md LICENSE dist/TrueShot-${{ runner.os }}/

      - name: Upload artifact
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v5
        with:
          name: TrueShot-${{ runner.os }}-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # ===================================================================
  # required-checks — fan-in job that branch protection rules depend
  # on. Lets us tweak the matrix above without re-pointing the rule.
  # ===================================================================
  required-checks:
    name: required-checks
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any build job failed
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build matrix did not fully succeed (${{ needs.build.result }})"
            exit 1
          fi
          echo "All required checks passed."
