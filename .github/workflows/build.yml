name: build

# When to run: every push to main and every PR.
# Manual trigger also available via the Actions tab.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

# Cancel previous runs of the same branch when a new commit lands.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Shared env. vcpkg's GitHub Actions cache is opt-in via VCPKG_BINARY_SOURCES.
env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # ===================================================================
  # build — compile + smoke test on every supported OS.
  # ===================================================================
  build:
    name: build (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Run every matrix entry to see all failures.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------------
      # vcpkg expects its GHA cache token through these env vars.
      # The github-script step exports them so vcpkg picks them up.
      - name: Export vcpkg cache tokens
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # ---------------------------------------------------------------
      # System packages required by GLFW / OpenGL on Linux.
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev libwayland-dev \
            libxkbcommon-dev libasound2-dev xvfb

      # ---------------------------------------------------------------
      # Ninja — robust install with the dedicated action that puts it
      # on PATH and validates the install on every OS.
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # ---------------------------------------------------------------
      # MSVC environment must be loaded before CMake on Windows so that
      # cl.exe / link.exe are on PATH for Ninja.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------------------------------------------------------------
      - name: Show toolchain versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
          "$VCPKG_INSTALLATION_ROOT/vcpkg" version || true
          c++ --version || cl 2>&1 | head -1 || true

      # ---------------------------------------------------------------
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DTRUESHOT_WARNINGS_AS_ERRORS=ON

      # ---------------------------------------------------------------
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # ---------------------------------------------------------------
      # Smoke test: confirm the executable exists and is a valid binary.
      # Phase 1.9 will add a real headless run; for now we just check
      # the artefact was produced.
      - name: Smoke test (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -x build/bin/TrueShot
          file build/bin/TrueShot

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "build/bin/${{ matrix.build_type }}/TrueShot.exe",
            "build/bin/TrueShot.exe"
          )
          $found = $false
          foreach ($exe in $candidates) {
            if (Test-Path $exe) {
              Write-Host "Found: $exe"
              Get-Item $exe
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Error "TrueShot.exe not found in any expected location"
            exit 1
          }

      # ---------------------------------------------------------------
      # Package the Release artefact (binary + shaders + LICENSE)
      # so playtesters can grab it from the run page.
      - name: Package artifact
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          mkdir -p dist/TrueShot-${{ runner.os }}
          cp -R build/bin/* dist/TrueShot-${{ runner.os }}/
          cp -R shaders     dist/TrueShot-${{ runner.os }}/
          cp README.md LICENSE dist/TrueShot-${{ runner.os }}/

      - name: Upload artifact
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: TrueShot-${{ runner.os }}-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # ===================================================================
  # required-checks — fan-in job that branch protection rules depend
  # on. Lets us tweak the matrix above without re-pointing the rule.
  # ===================================================================
  required-checks:
    name: required-checks
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any build job failed
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build matrix did not fully succeed (${{ needs.build.result }})"
            exit 1
          fi
          echo "All required checks passed."
