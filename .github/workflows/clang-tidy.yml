name: clang-tidy

# Deep static analysis. Too slow for every PR — runs weekly + on demand.
on:
  schedule:
    - cron: "0 4 * * 1" # Every Monday at 04:00 UTC.
  workflow_dispatch:

concurrency:
  group: clang-tidy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Export vcpkg cache tokens
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev libwayland-dev \
            libxkbcommon-dev libasound2-dev

      - name: Install clang-tidy
        run: |
          sudo apt-get install -y clang-tidy-18 \
            || sudo apt-get install -y clang-tidy

      - name: Resolve clang-tidy binary
        id: ct
        run: |
          for bin in clang-tidy-18 clang-tidy-17 clang-tidy-16 clang-tidy; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "bin=$bin" >> "$GITHUB_OUTPUT"
              "$bin" --version
              exit 0
            fi
          done
          echo "::error::no clang-tidy binary found"
          exit 1

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$GITHUB_WORKSPACE/vcpkg"
          "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"

      - name: Configure (generate compile_commands.json)
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Run clang-tidy on project sources
        run: |
          mapfile -t FILES < <(git ls-files 'src/*.cpp' \
            | grep -Ev '^(build/|netcode/build/|third_party/)' || true)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No sources to check."
            exit 0
          fi
          ${{ steps.ct.outputs.bin }} -p build "${FILES[@]}" \
            --warnings-as-errors='*'
